name: Verify Finance Accounting 2
on:
  push:
    branches:
      - feat/finance-accounting-2-detailed-categories
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- src/simulation/financeJournal.test.ts src/simulation/liveFinance.test.ts
