name: Verify Hotel Furniture and Design Quality
on:
  push:
    branches:
      - feature/hotel-builder-furniture-quality-v3
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production TypeScript and Vite build
        run: npm run build
      - name: Targeted furniture, hotel and builder regression
        run: npm test -- src/hotelFurnitureQuality.test.ts src/hotelBlueprintEditing.test.ts src/internalConstruction.test.ts src/hotelOperations.test.ts src/components/blueprintViewport.test.ts
      - name: Full suite (report existing unrelated failures)
        continue-on-error: true
        run: npm test
