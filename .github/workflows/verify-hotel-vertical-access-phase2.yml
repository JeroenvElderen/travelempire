name: Verify Hotel Architecture Phase 2 Vertical Access
on:
  push:
    branches:
      - feature/hotel-architecture-vertical-access-phase2
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production TypeScript and Vite build
        run: npm run build
      - name: Vertical access, door routes, hotel operations and construction
        run: npm test -- src/hotelVerticalAccess.test.ts src/hotelAccess.test.ts src/hotelBlueprintEditing.test.ts src/hotelFurnitureQuality.test.ts src/hotelOperations.test.ts src/internalConstruction.test.ts src/components/blueprintViewport.test.ts
      - name: Full suite (report pre-existing unrelated failures)
        continue-on-error: true
        run: npm test
