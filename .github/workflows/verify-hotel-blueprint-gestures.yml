name: Verify hotel blueprint gestures
on:
  push:
    branches: [fix/hotel-builder-mobile-viewport]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- src/components/blueprintViewport.test.ts
