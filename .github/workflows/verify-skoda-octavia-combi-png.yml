name: Verify Skoda Octavia Combi PNGs
on:
  push:
    branches:
      - feature/skoda-octavia-combi-png-paints
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate real transparent game sprite atlas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          p=Path('public/assets/vehicles/skoda-octavia-combi/paint-atlas.png')
          data=p.read_bytes()
          assert data[:8]==b'\\x89PNG\\r\\n\\x1a\\n', 'PNG signature missing'
          assert data[12:16]==b'IHDR', 'Invalid PNG header'
          width,height=unpack('>II',data[16:24])
          assert (width,height)==(616,119), (width,height)
          assert data[25] in (3,6), 'PNG must have RGBA or indexed colour'
          assert data[25]==6 or b'tRNS' in data, 'PNG transparency missing'
          print(f'Validated transparent {width}x{height} sprite atlas ({len(data)} bytes)')
          PY
      - name: Production TypeScript and Vite build
        run: npm run build
      - name: PNG and Škoda factory paint integration regression tests
        run: npm test -- src/skodaOctaviaSprites.test.ts src/audiA5Sprites.test.ts src/audiA6Sprites.test.ts src/europeanVehicleCatalog.test.ts src/startupRecovery.test.ts
      - name: Full tests (report known unrelated failures)
        continue-on-error: true
        run: npm test
