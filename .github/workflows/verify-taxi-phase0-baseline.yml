name: Baseline taxi long-trip relevant tests
on:
  push:
    branches: [verify/taxi-phase0-baseline]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- src/simulation/taxiDiscovery.test.ts src/simulation/passengerTripPricing.test.ts
