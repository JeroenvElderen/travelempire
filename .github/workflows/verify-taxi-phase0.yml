name: Verify Taxi Phase 0 long journeys
on:
  push:
    branches:
      - feat/taxi-phase0-long-distance-passengers
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- src/simulation/passengerJourneys.test.ts src/simulation/passengerDepotDemand.test.ts src/simulation/driverSchedule.test.ts src/simulation/passengerRouteRecovery.test.ts src/simulation/passengerSettlement.test.ts src/simulation/passengerTripPricing.test.ts src/simulation/taxiAccessRouting.test.ts src/simulation/taxiDiscovery.test.ts src/simulation/directedRoadRouting.test.ts src/simulation/roundaboutTransit.test.ts
