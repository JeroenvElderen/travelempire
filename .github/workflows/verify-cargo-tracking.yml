name: Verify hotel cargo tracking
on:
  push:
    branches: [fix/hotel-cargo-visibility-tracking]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- src/constructionLogistics.test.ts src/internalConstruction.test.ts
