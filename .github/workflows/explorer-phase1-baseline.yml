name: Baseline explorer tests
on:
  push:
    branches:
      - verify/explorer-phase1-baseline
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- src/simulation/explorerRoadPlanner.test.ts src/simulation/specialistExplorers.test.ts
