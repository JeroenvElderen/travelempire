name: Verify Mobile Hotel Builder Workspace
on:
  push:
    branches:
      - feature/mobile-builder-workspace-redesign
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production TypeScript and Vite build
        run: npm run build
      - name: Hotel floor plan, corridors, furniture, safety and construction tests
        run: npm test -- src/components/blueprintViewport.test.ts src/hotelCorridors.test.ts src/hotelFurnitureCollections.test.ts src/furnitureCatalog.test.ts src/hotelVisualisation.test.ts src/hotelSafety.test.ts src/hotelAtmosphere.test.ts src/hotelVerticalAccess.test.ts src/hotelAccess.test.ts src/hotelBlueprintEditing.test.ts src/hotelFurnitureQuality.test.ts src/hotelOperations.test.ts src/internalConstruction.test.ts
      - name: Full regression suite (report unrelated existing failures)
        continue-on-error: true
        run: npm test
