name: Validate Explorer Autopilot phase 1
on:
  push:
    branches:
      - feat/explorer-autopilot-phase1-consistency
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- src/simulation/explorerAutopilotPhase1.test.ts src/simulation/explorerRoadPlanner.test.ts src/simulation/explorerStart.test.ts src/simulation/connectedExploration.test.ts src/simulation/specialistExplorers.test.ts src/simulation/directedRoadRouting.test.ts
