name: Verify headless world events
on:
  push:
    branches: [refactor/world-events-headless-no-npc-traffic]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- src/simulation/livingWorld.test.ts src/components/WorldEventsController.test.ts
