name: Verify Hotel Builder Precision Editing
on:
  push:
    branches:
      - feature/hotel-builder-room-editor-v2
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Blueprint, hotel and construction regression tests
        run: npm test -- src/hotelBlueprintEditing.test.ts src/internalConstruction.test.ts src/components/blueprintViewport.test.ts src/hotelOperations.test.ts src/constructionTime.test.ts
      - name: Full suite (existing unrelated failures reported)
        continue-on-error: true
        run: npm test
