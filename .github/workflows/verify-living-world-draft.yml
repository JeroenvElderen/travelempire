name: Living world draft checks
on:
  push:
    branches:
      - feature/living-world-hybrid-emergency
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify living-world tests
        run: npm test -- src/simulation/livingWorld.test.ts
      - name: Full suite (known pre-existing failures on main)
        continue-on-error: true
        run: npm test
