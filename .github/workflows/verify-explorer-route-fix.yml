name: Verify explorer Checking Route loop fix
on:
  push:
    branches: [fix/explorers-checking-route-loop-ios]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- src/simulation/explorerAutopilotPhase3.test.ts src/simulation/explorerAutopilotPhase2.test.ts src/simulation/explorerAutopilotPhase1.test.ts src/simulation/explorerOperations.test.ts src/simulation/explorerRoadPlanner.test.ts src/simulation/explorerStart.test.ts src/simulation/connectedExploration.test.ts src/simulation/specialistExplorers.test.ts src/simulation/directedRoadRouting.test.ts src/simulation/roundaboutTransit.test.ts
