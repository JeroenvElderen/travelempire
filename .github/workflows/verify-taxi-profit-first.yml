name: Verify Taxi Profit-First Markets
on:
  push:
    branches:
      - feat/taxi-market-profit-first
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- src/simulation/taxiDispatchStrategy.test.ts src/simulation/taxiRegionalCoverage.test.ts src/simulation/passengerDepotDemand.test.ts src/simulation/taxiAutopilotPhase3.test.ts src/simulation/taxiAnalytics.test.ts src/simulation/taxiRepositioning.test.ts src/simulation/passengerJourneys.test.ts src/simulation/passengerSettlement.test.ts src/simulation/driverSchedule.test.ts src/simulation/shiftRest.test.ts src/simulation/directedRoadRouting.test.ts
