name: Verify Hotel Furniture Catalogue Phase 6
on:
  push:
    branches:
      - feature/hotel-phase6-furniture-catalog
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Production TypeScript and Vite build
        run: npm run build
      - name: Furniture catalogue, hotel renderer, billing and hotel regression
        run: npm test -- src/furnitureCatalog.test.ts src/hotelVisualisation.test.ts src/hotelSafety.test.ts src/hotelAtmosphere.test.ts src/hotelVerticalAccess.test.ts src/hotelAccess.test.ts src/hotelBlueprintEditing.test.ts src/hotelFurnitureQuality.test.ts src/hotelOperations.test.ts src/internalConstruction.test.ts src/components/blueprintViewport.test.ts
      - name: Full suite (existing unrelated failures reported)
        continue-on-error: true
        run: npm test
