name: Verify pedestrian and cycling tiles
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/osm_mobility_access.py"
      - "scripts/build_greece_mobility_tiles.py"
      - "scripts/tests/test_greece_mobility.py"
      - ".github/workflows/verify-greece-mobility.yml"
jobs:
  mobility:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install osmium
        run: python -m pip install osmium
      - name: Compile mobility scripts
        run: python -m py_compile scripts/osm_mobility_access.py scripts/build_greece_mobility_tiles.py
      - name: Test mobility access and offline OSM tile generation
        run: python -m unittest discover -s scripts/tests -p 'test_greece_mobility.py' -v
