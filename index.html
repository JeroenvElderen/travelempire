<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
 <meta name="theme-color" content="#10191b"/>
 <title>TravelEmpire</title>
 <style>
  html,body{margin:0;min-height:100%;background:#10191b;color:#e8f5f6;font-family:system-ui,-apple-system,sans-serif}
  #startup-failure{position:fixed;inset:0;z-index:2147483647;display:none;align-items:center;justify-content:center;padding:24px;background:#10191b;box-sizing:border-box}
  #startup-failure.visible{display:flex}
  #startup-failure article{width:min(100%,420px);padding:24px;border:1px solid #375365;border-radius:18px;background:#17252d}
  #startup-failure h1{font-size:20px;margin:0 0 12px}
  #startup-failure p{font-size:14px;line-height:1.5;color:#c4d3db}
  #startup-failure button{padding:12px 16px;border:0;border-radius:10px;background:#65dcc0;color:#071e1c;font-weight:700}
 </style>
 <script>
  (function(){
   var failed=false;
   function rootHasContent(){
    var root=document.getElementById('root');
    return !!(root&&root.children.length);
   }
   function clearWarning(){
    if(!rootHasContent())return;
    failed=false;
    var panel=document.getElementById('startup-failure');
    if(panel)panel.classList.remove('visible');
   }
   function report(message){
    if(failed||rootHasContent())return;
    failed=true;
    var panel=document.getElementById('startup-failure');
    var detail=document.getElementById('startup-error-detail');
    if(detail)detail.textContent=String(message||'The app bundle did not load').slice(0,300);
    if(panel)panel.classList.add('visible');
   }
   // Watch actual DOM mount, not just elapsed time: an old warning must
   // vanish if Safari eventually finishes loading the game.
   document.addEventListener('DOMContentLoaded',function(){
    var root=document.getElementById('root');
    if(root&&typeof MutationObserver!=='undefined'){
     new MutationObserver(clearWarning).observe(root,{childList:true});
    }
    clearWarning();
   });
   window.addEventListener('error',function(e){
    if(rootHasContent())return;
    var resource=e.target;
    if(resource&&resource!==window&&resource.tagName){
     var kind=String(resource.tagName).toLowerCase();
     if(kind==='script'||kind==='link'){
      report('An application file failed to load ('+kind+'). Reload the latest version without clearing site data.');
      return;
     }
    }
    report(e.message||'An application script failed to load');
   },true);
   window.addEventListener('unhandledrejection',function(e){
    if(!rootHasContent())report(e.reason&&e.reason.message||'An application file failed to load');
   });
   window.setTimeout(function(){
    if(!rootHasContent())report('The application has not rendered yet. Check whether the deployment completed and try reloading.');
   },45000);
  })();
 </script></head>
<body>
 <div id="root"></div>
 <div id="startup-failure" role="alert"><article><h1>TravelEmpire could not start</h1>
  <p id="startup-error-detail">The latest application bundle did not load.</p>
  <p>Your saved company and discoveries have not been cleared.</p>
  <button type="button" onclick="var u=new URL(location.href);u.searchParams.set('te_refresh',String(Date.now()));location.replace(u.toString())">Reload latest game</button>
 </article></div>
 <script type="module" src="/src/main.tsx"></script>
</body>
</html>
