<path d="M141 42Q220 28 299 42L330 52Q349 64 350 91V268L360 285V743Q359 767 339 774H101Q81 767 80 743V285L90 268V91Q91 64 110 52Z" fill="url(#body)" stroke="#687d80" stroke-width="4"/>
