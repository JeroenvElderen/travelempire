<g><rect x="102" y="288" width="236" height="10" rx="2" fill="#cbd8d6"/><rect x="107" y="289" width="48" height="8" fill="#d9272e"/><rect x="166" y="289" width="48" height="8" fill="#f5f7f4"/><rect x="225" y="289" width="48" height="8" fill="#d9272e"/><rect x="284" y="289" width="48" height="8" fill="#f5f7f4"/></g>
<!-- side warning lamps -->
<g fill="#d42e30"><rect x="78" y="302" width="7" height="27" rx="2"/><rect x="355" y="302" width="7" height="27" rx="2"/><rect x="78" y="708" width="7" height="28" rx="2"/><rect x="355" y="708" width="7" height="28" rx="2"/></g>
