<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 820" width="440" height="820">
<defs>
 <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#aebdc0"/><stop offset=".09" stop-color="#f7faf7"/><stop offset=".48" stop-color="#fffefa"/><stop offset=".91" stop-color="#e5eeeb"/><stop offset="1" stop-color="#82969b"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d2dfdb"/><stop offset=".12" stop-color="#ffffff"/><stop offset=".84" stop-color="#f4faf7"/><stop offset="1" stop-color="#b8c9c8"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172a33"/><stop offset=".35" stop-color="#3b6c7d"/><stop offset=".7" stop-color="#173743"/><stop offset="1" stop-color="#0c202a"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9d1721"/><stop offset=".5" stop-color="#ff5c56"/><stop offset="1" stop-color="#a30c1b"/></linearGradient>
 <pattern id="rib" width="31" height="32" patternUnits="userSpaceOnUse"><path d="M1 0V32" stroke="#b5c9c8" stroke-width="2"/><path d="M5 0V32" stroke="#fff" stroke-width="2"/></pattern>
</defs>
<!-- wheels and running boards -->
<g fill="#29343a" stroke="#65747a" stroke-width="3"><rect x="72" y="162" width="16" height="83" rx="7"/><rect x="352" y="162" width="16" height="83" rx="7"/><rect x="68" y="520" width="18" height="100" rx="7"/><rect x="354" y="520" width="18" height="100" rx="7"/></g>
<g fill="#8da7aa"><rect x="75" y="330" width="12" height="32" rx="3"/><rect x="353" y="330" width="12" height="32" rx="3"/><rect x="75" y="665" width="12" height="34" rx="3"/><rect x="353" y="665" width="12" height="34" rx="3"/></g>
