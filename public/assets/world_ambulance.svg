<path d="M0 -62V54" stroke="white" stroke-width="5" stroke-linecap="round"/>
<path d="M11 -52C-16 -48 17 -24 -3 -9C-20 3 17 15 -4 33C-12 40 -5 46 0 47" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
<circle cx="1" cy="-58" r="6" fill="white"/>
