<path d="M-19 -80H19V-46L49 -64L68 -32L38 -14L68 3L49 36L19 18V72H-19V18L-49 36L-68 3L-38 -14L-68 -32L-49 -64L-19 -46Z" fill="#102f9b" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
