<rect x="152" y="48" width="136" height="14" rx="5" fill="#293b42" stroke="#9da9ab" stroke-width="2"/>
<rect x="158" y="50" width="53" height="10" rx="3" fill="#e93537"/><rect x="229" y="50" width="53" height="10" rx="3" fill="#2c76c9"/>
