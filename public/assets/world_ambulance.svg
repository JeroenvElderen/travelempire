<path d="M112 153Q220 140 328 153L327 231Q220 249 113 231Z" fill="#202e35" stroke="#9daeb1" stroke-width="4"/>
<path d="M120 163Q220 153 320 163L317 224Q220 237 123 224Z" fill="url(#glass)"/>
<path d="M127 169Q190 157 238 166L160 213L127 218Z" fill="#b4dce3" opacity=".22"/>
