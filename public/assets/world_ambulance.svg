<path d="M106 193L70 207M334 193L370 207" fill="none" stroke="#37474d" stroke-width="5"/>
<path d="M57 202L76 197L82 204L61 213Z M383 202L364 197L358 204L379 213Z" fill="#26343b" stroke="#a4b3b4" stroke-width="2"/>
