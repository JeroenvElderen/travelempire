<rect x="1045" y="201" width="5" height="10" rx="2"/><rect x="1045" y="218" width="5" height="10" rx="2"/><rect x="1045" y="235" width="5" height="10" rx="2"/><rect x="1045" y="252" width="5" height="10" rx="2"/><rect x="1045" y="269" width="5" height="10" rx="2"/><rect x="1045" y="286" width="5" height="10" rx="2"/>
