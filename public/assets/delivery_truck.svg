<svg xmlns="http://www.w3.org/2000/svg" width="1299" height="500" viewBox="0 0 1299 500">
<title>Blue semi truck and trailer — top view</title>
<desc>Detailed scalable vector illustration of a blue articulated semi truck viewed from above, facing right.</desc>
<defs>
 <linearGradient id="trailer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#246e88"/><stop offset="1" stop-color="#348ba4"/></linearGradient>
 <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6da5c8"/><stop offset="1" stop-color="#4b8eb6"/></linearGradient>
 <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#153f4f"/><stop offset=".55" stop-color="#9cd5df"/><stop offset="1" stop-color="#d3eef0"/></linearGradient>
 <linearGradient id="frame" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#b7b7b7"/><stop offset=".5" stop-color="#dedede"/><stop offset="1" stop-color="#898989"/></linearGradient>
 <filter id="shadow" x="-10%" y="-30%" width="125%" height="170%"><feGaussianBlur stdDeviation="2"/></filter>
</defs>
